name: CI

on:
  push:
    branches: [ master, t3/* ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - '.githooks/**'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - '.githooks/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vite.config.ts'
              - 'vitest.config.ts'
              - 'tailwind.config.js'
              - 'postcss.config.js'
              - 'scripts/**'
              - 'tests/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend Checks & Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend checks & tests
        run: npm run test:fe

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies and download tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev libsoup-3.0-dev ffmpeg curl tar gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good
          curl -sSL "https://github.com/nilaoda/N_m3u8DL-RE/releases/download/v0.6.0-beta/N_m3u8DL-RE_v0.6.0-beta_linux-x64_20260629.tar.gz" -o /tmp/nm.tar.gz
          sudo tar -xzf /tmp/nm.tar.gz -C /usr/local/bin/
          sudo ln -sf /usr/local/bin/N_m3u8DL-RE /usr/local/bin/n-m3u8dl-re
          sudo ln -sf /usr/local/bin/N_m3u8DL-RE /usr/bin/n-m3u8dl-re
          sudo chmod +x /usr/local/bin/n-m3u8dl-re /usr/local/bin/N_m3u8DL-RE /usr/bin/n-m3u8dl-re
          rm -f /tmp/nm.tar.gz

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Run backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [changes, frontend, backend]
    if: always()
    steps:
      - name: Check changes job status
        if: needs.changes.result != 'success'
        run: |
          echo "Changes job did not succeed: ${{ needs.changes.result }}"
          exit 1

      - name: Check dependent jobs status
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more dependent jobs failed or were cancelled"
          exit 1

      - name: Gate check passed
        run: echo "All checks passed or safely skipped"
