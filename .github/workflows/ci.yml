name: CI

on:
  push:
    branches: [ master, t3/* ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Checks & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend checks & tests
        run: npm run test:fe

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies and download tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev libsoup-3.0-dev ffmpeg curl tar
          curl -sSL "https://github.com/nilaoda/N_m3u8DL-RE/releases/download/v0.6.0-beta/N_m3u8DL-RE_v0.6.0-beta_linux-x64_20260629.tar.gz" -o /tmp/nm.tar.gz
          sudo tar -xzf /tmp/nm.tar.gz -C /usr/local/bin/
          sudo ln -sf /usr/local/bin/N_m3u8DL-RE /usr/local/bin/n-m3u8dl-re
          sudo ln -sf /usr/local/bin/N_m3u8DL-RE /usr/bin/n-m3u8dl-re
          sudo chmod +x /usr/local/bin/n-m3u8dl-re /usr/local/bin/N_m3u8DL-RE /usr/bin/n-m3u8dl-re
          rm -f /tmp/nm.tar.gz

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Run backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
