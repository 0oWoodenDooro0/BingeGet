[package]
name = "bingeget"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1.10"
anyhow = "1.0"
thiserror = "1.0"

[build-dependencies]
tauri-build = { version = "2", default-features = false }

[dev-dependencies]
tokio-test = "0.4"
